services:
  - type: web
    name: maktab-hisobot-api
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: waitress-serve --listen=0.0.0.0:$PORT app:application
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: PUBLIC_URL
        value: https://maktab-hisobot-api.onrender.com
      - key: TELEGRAM_SET_WEBHOOK
        value: "1"
      - key: CRON_SECRET
        generateValue: true
