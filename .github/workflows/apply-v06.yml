name: Apply v0.6 update once

on:
  push:
    paths:
      - ".github/workflows/apply-v06.yml"
      - ".github/workflows/v06-update.patch"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested v0.6 patch
        run: |
          git config user.name "MaktabHisobot Updater"
          git config user.email "actions@users.noreply.github.com"
          git apply --index .github/workflows/v06-update.patch
          git rm .github/workflows/apply-v06.yml .github/workflows/v06-update.patch
          git commit -m "Migrate production storage to Neon Postgres"
          git push origin main
